<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="secid.css">
<script src="cubos.js"></script>
<style>
  .slide { width: 1080px; height: 1350px; padding: 72px 80px 64px; display: flex; flex-direction: column; }
  .cubos { position: absolute; top: 0; right: -40px; width: 760px; height: 300px; }
  .logo { width: 132px; height: 132px; margin-left: -18px; }
  .badge { font-size: 22px; margin-top: 46px; align-self: flex-start; }
  h1 { font-size: 74px; line-height: 1.05; margin-top: 26px; max-width: 900px; }
  h1 em { font-style: normal; color: var(--naranja); }
  .desc { font-size: 30px; line-height: 1.4; color: var(--gris); margin-top: 24px; max-width: 880px; }

  .ponente {
    display: flex; align-items: center; gap: 22px; margin-top: 40px;
    padding: 22px 26px; background: var(--negro-2); border-radius: 20px; border-left: 6px solid var(--dorado);
  }
  .ponente .ini {
    width: 76px; height: 76px; border-radius: 50%; background: var(--pizarra);
    display: grid; place-items: center; font: 700 30px "Poppins", sans-serif; color: var(--crema);
  }
  .ponente b { font: 600 30px "Poppins", sans-serif; display: block; }
  .ponente span { font-size: 24px; color: var(--gris); }

  .ficha { margin-top: 40px; font-size: 28px; }
  .cta { margin-top: auto; padding: 26px 40px; font-size: 32px; align-self: flex-start; }
  .cta .url { font-size: 28px; }
  footer { display: flex; justify-content: space-between; margin-top: 34px; font-size: 22px; color: var(--gris-osc); }
</style>
</head>
<body>
<section class="slide">
  <svg class="cubos" viewBox="0 0 520 560" aria-hidden="true"></svg>
  <img class="logo" src="../../assets/secid/logo-secid.png" alt="SECiD">

  <div class="badge" data-campo="tipo"></div>
  <h1 class="titulo" data-campo="titulo"></h1>
  <p class="desc" data-campo="descripcion"></p>

  <div class="ponente" data-bloque>
    <div class="ini" data-campo="ponente.iniciales"></div>
    <div><b data-campo="ponente.nombre" data-opcional></b><span data-campo="ponente.cargo"></span></div>
  </div>

  <div class="ficha">
    <div class="fila"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div class="txt"><b data-campo="fecha"></b></div></div>
    <div class="fila"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div class="txt"><b data-campo="hora"></b></div></div>
    <div class="fila"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div class="txt"><b data-campo="lugar"></b><span data-campo="lugar_detalle"></span></div></div>
  </div>

  <div class="cta"><span data-campo="cta"></span><span class="url" data-campo="url"></span></div>
  <footer><span>@secid_unam</span><span>secid.mx</span></footer>
</section>
<script>
  llenar();
  cubos(document.querySelector(".cubos"), [
    {x: 560, y: 70,  r: 64, color: "crema"},
    {x: 690, y: 160, r: 50, color: "naranja"},
    {x: 430, y: 160, r: 40, color: "pizarra", marco: "dorado"},
    {x: 300, y: 90,  r: 24, color: "crema"},
    {x: 560, y: 240, r: 28, color: "crema", marco: "naranja"},
    {x: 200, y: 180, r: 14, color: "dorado"},
    {x: 690, y: 20,  r: 34, color: "dorado", marco: "pizarra"},
  ]);
</script>
</body>
</html>
